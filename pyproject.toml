[project]
name = "emacs-web"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nicolas Couture", email = "nicolas@stormvault.net" }
]
requires-python = ">=3.12.13"
dependencies = [
    "emacs-jail",
    "fastapi>=0.143.0",
    "firebase-admin>=7.7.0",
    "google-antigravity>=0.1.22",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "sse-starlette>=3.5.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
emacs-web = "emacs_web:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
emacs-jail = { path = "firejail", editable = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
src = ["src", "tests"]
exclude = [
    "firejail",
    ".venv",
]
